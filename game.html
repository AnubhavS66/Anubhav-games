<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Candy Crush Real</title>
    <style>
        body { background:#1a1a2e; color:white; font-family:Arial; text-align:center; user-select: none; }
        h1 { color:#ffcc00; text-shadow: 2px 2px #000; }
        .stats-bar { background: #16213e; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
        #board {
            display:grid;
            grid-template-columns: repeat(8, 50px);
            grid-gap:5px;
            justify-content:center;
            margin-top:10px;
            background: #0f3460;
            padding: 10px;
            border-radius: 10px;
            border: 4px solid #533483;
        }
        .candy {
            width:50px; height:50px; border-radius:10px; cursor:pointer;
            display:flex; justify-content:center; align-items:center; font-size: 25px;
            transition: transform 0.2s;
        }
        .candy:active { transform: scale(0.9); }
        .red { background: radial-gradient(circle, #ff4d4d, #b30000); }
        .blue { background: radial-gradient(circle, #4d94ff, #0044cc); }
        .green { background: radial-gradient(circle, #5cd65c, #1e7b1e); }
        .yellow { background: radial-gradient(circle, #ffff66, #ccaa00); }
        .purple { background: radial-gradient(circle, #b366ff, #6600cc); }
        .bomb { background: #000; border: 2px solid #fff; box-shadow: 0 0 10px #fff; }
        .selected { border: 3px solid white; box-shadow: 0 0 15px white; }
        
        #withdrawBox { 
            margin-top:20px; background: #16213e; padding: 20px; 
            border-radius: 10px; border: 2px solid #ffcc00; display: inline-block;
        }
        input { padding: 10px; border-radius: 5px; border: none; width: 200px; }
        button { 
            padding: 10px 20px; background: #ffcc00; border: none; 
            border-radius: 5px; cursor: pointer; font-weight: bold; color: #000;
        }
        button:hover { background: #e6b800; }
    </style>
</head>
<body>

<h1>Candy Blast</h1>

<div class="stats-bar">
    Score: <span id="score">0</span> | 
    Level: <span id="level">1</span> | 
    Coins: <span id="coins">0</span>
</div>

<div id="board"></div>

<div id="withdrawBox">
    <h3>Wallet & Withdraw</h3>
    <p>Min. Withdraw: 10,000 Coins (₹10)</p>
    <input id="upi" placeholder="Enter UPI ID (e.g. name@apl)">
    <button onclick="withdraw()">Withdraw Cash</button>
    <p id="msg" style="color: #00ff00; font-weight: bold;"></p>
</div>

<script>
const width = 8;
const colors = ["red","blue","green","yellow","purple"];
let board = [];
let score = 0, level = 1, coins = 0;
let firstId = null;

const boardDiv = document.getElementById("board");

// Load Progress
if(localStorage.candySave){
    let s = JSON.parse(localStorage.candySave);
    score = s.score; level = s.level; coins = s.coins;
}

function initGame() {
    // Fill board with no initial matches
    for(let i=0; i<width*width; i++) {
        board[i] = colors[Math.floor(Math.random()*colors.length)];
    }
    render();
    updateUI();
}

function render() {
    boardDiv.innerHTML = "";
    board.forEach((color, i) => {
        let div = document.createElement("div");
        div.className = `candy ${color}`;
        if(color === "bomb") div.innerHTML = "💣";
        div.dataset.id = i;
        div.onclick = handleSelect;
        boardDiv.appendChild(div);
    });
}

function handleSelect() {
    let id = parseInt(this.dataset.id);
    
    if(firstId === null) {
        firstId = id;
        render();
        boardDiv.children[firstId].classList.add("selected");
    } else {
        let secondId = id;
        if(isAdjacent(firstId, secondId)) {
            trySwap(firstId, secondId);
        }
        firstId = null;
        render();
    }
}

function isAdjacent(a, b) {
    let diff = Math.abs(a - b);
    let isNext = diff === 1 && Math.floor(a/width) === Math.floor(b/width);
    let isAbove = diff === width;
    return isNext || isAbove;
}

function trySwap(a, b) {
    // Temp swap
    let temp = board[a];
    board[a] = board[b];
    board[b] = temp;

    if(checkMatches()) {
        // Match found!
        processMatches();
    } else {
        // No match? Swap back
        board[b] = board[a];
        board[a] = temp;
    }
}

function checkMatches() {
    let matchFound = false;
    // Check horizontal
    for(let i=0; i<64; i++) {
        if(i % width < width - 2) {
            if(board[i] && board[i] === board[i+1] && board[i] === board[i+2]) matchFound = true;
        }
        if(i < 48) {
            if(board[i] && board[i] === board[i+width] && board[i] === board[i+width*2]) matchFound = true;
        }
    }
    return matchFound;
}

function processMatches() {
    let toDestroy = new Set();

    // Find horizontal
    for(let i=0; i<64; i++) {
        if(i % width < width - 2) {
            if(board[i] && board[i] === board[i+1] && board[i] === board[i+2]) {
                toDestroy.add(i); toDestroy.add(i+1); toDestroy.add(i+2);
            }
        }
        if(i < 48) {
            if(board[i] && board[i] === board[i+width] && board[i] === board[i+width*2]) {
                toDestroy.add(i); toDestroy.add(i+width); toDestroy.add(i+width*2);
            }
        }
    }

    if(toDestroy.size > 0) {
        toDestroy.forEach(id => {
            if(board[id] === "bomb") triggerBomb(id);
            board[id] = "";
            score += 10;
            coins += 2;
        });

        // Chance to spawn a bomb
        if(toDestroy.size > 3) {
            let randomIdx = Array.from(toDestroy)[0];
            board[randomIdx] = "bomb";
        }

        setTimeout(() => {
            refillBoard();
            render();
            processMatches(); // Recursive for chains
            updateUI();
            save();
        }, 300);
    }
}

function triggerBomb(i) {
    let row = Math.floor(i/width), col = i%width;
    for(let r=row-1; r<=row+1; r++) {
        for(let c=col-1; c<=col+1; c++) {
            let id = r*width + c;
            if(id>=0 && id<64 && c>=0 && c<width) {
                board[id] = "";
                score += 5;
            }
        }
    }
}

function refillBoard() {
    for(let i=63; i>=0; i--) {
        if(board[i] === "") {
            let rowAbove = i - width;
            while(rowAbove >= 0 && board[rowAbove] === "") rowAbove -= width;
            
            if(rowAbove >= 0) {
                board[i] = board[rowAbove];
                board[rowAbove] = "";
            } else {
                board[i] = colors[Math.floor(Math.random()*colors.length)];
            }
        }
    }
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("coins").innerText = coins;
    level = Math.floor(score/500) + 1;
    document.getElementById("level").innerText = level;
}

function save() {
    localStorage.candySave = JSON.stringify({score, level, coins});
}

function withdraw() {
    let upi = document.getElementById("upi").value;
    if(!upi.includes("@")) return alert("Please enter a valid UPI ID!");
    
    if(coins >= 10000) {
        let amt = coins/1000;
        document.getElementById("msg").innerText = `Withdrawal of ₹${amt} requested to ${upi}!`;
        coins = 0;
        save();
        updateUI();
    } else {
        alert("Bhai, kam se kam 10,000 coins chahiye! Abhi aur khelo.");
    }
}

initGame();
</script>
</body>
</html>
