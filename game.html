<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Blast Bomb Version</title>

<style>

body{
background: radial-gradient(circle,#1a0033,#000);
margin:0;
font-family:sans-serif;
color:white;
overflow:hidden;
}

.header{
display:flex;
justify-content:space-around;
align-items:center;
height:60px;
background:rgba(255,255,255,0.05);
border-bottom:2px solid cyan;
}

.header div{
color:cyan;
font-size:18px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(7,1fr);
grid-template-rows:repeat(9,1fr);
gap:4px;
padding:10px;
height:calc(100vh - 60px);
}

.candy{
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
background:rgba(255,255,255,0.05);
border-radius:10px;
}

#msg{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
color:yellow;
display:none;
}

</style>
</head>
<body>

<div class="header">

<div id="score">Score: 0</div>
<div id="level">Level: 1</div>
<div id="coins">Coins: 0</div>

</div>

<div id="msg"></div>

<div class="grid" id="grid"></div>

<script>

const grid=document.getElementById("grid");

const scoreDisplay=document.getElementById("score");
const levelDisplay=document.getElementById("level");
const coinsDisplay=document.getElementById("coins");
const msg=document.getElementById("msg");

const width=7;
const height=9;

const items=["🍭","💎","🚀","🔥","🍓"];
const bomb="💣";

let squares=[];

let score=parseInt(localStorage.getItem("score"))||0;
let level=parseInt(localStorage.getItem("level"))||1;
let coins=parseInt(localStorage.getItem("coins"))||0;

updateUI();

function saveGame(){

localStorage.setItem("score",score);
localStorage.setItem("level",level);
localStorage.setItem("coins",coins);

}

function updateUI(){

scoreDisplay.innerText="Score: "+score;
levelDisplay.innerText="Level: "+level;
coinsDisplay.innerText="Coins: "+coins;

saveGame();

}

function showMsg(text){

msg.innerText=text;
msg.style.display="block";

setTimeout(()=>msg.style.display="none",800);

}

function levelSystem(){

let newLevel=Math.floor(score/500)+1;

if(newLevel>level){

level=newLevel;

showMsg("LEVEL UP");

if(level%10===0){

coins+=500;
showMsg("+500 Coins");

}

updateUI();

}

}

function randomCandy(){

if(Math.random()<0.1){

return bomb;

}

return items[Math.floor(Math.random()*items.length)];

}

function createBoard(){

for(let i=0;i<width*height;i++){

const div=document.createElement("div");

div.className="candy";
div.id=i;

div.innerHTML=randomCandy();

grid.appendChild(div);

squares.push(div);

addSwipe(div);

}

}

let startId,startX,startY;

function addSwipe(div){

div.addEventListener("touchstart",(e)=>{

startId=parseInt(div.id);
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;

});

div.addEventListener("touchend",(e)=>{

let endX=e.changedTouches[0].clientX;
let endY=e.changedTouches[0].clientY;

let diffX=endX-startX;
let diffY=endY-startY;

let target=startId;

if(Math.abs(diffX)>Math.abs(diffY)){

if(diffX>30 && startId%width!=width-1)
target=startId+1;

else if(diffX<-30 && startId%width!=0)
target=startId-1;

}
else{

if(diffY>30 && startId+width<width*height)
target=startId+width;

else if(diffY<-30 && startId-width>=0)
target=startId-width;

}

if(target!=startId){

swap(startId,target);

setTimeout(()=>{

checkMatches();
dropCandies();

},100);

}

});

}

function swap(a,b){

let temp=squares[a].innerHTML;
squares[a].innerHTML=squares[b].innerHTML;
squares[b].innerHTML=temp;

}

function explodeBomb(index){

let area=[
index,
index-1,
index+1,
index-width,
index+width,
index-width-1,
index-width+1,
index+width-1,
index+width+1
];

area.forEach(i=>{

if(squares[i]){

squares[i].innerHTML="";

}

});

score+=150;

showMsg("BOOM!");

updateUI();

}

function checkMatches(){

let found=false;

for(let i=0;i<width*height;i++){

if(squares[i].innerHTML==bomb){

explodeBomb(i);
found=true;
continue;

}

let row=[i,i+1,i+2];

if(i%width<width-2){

let val=squares[i].innerHTML;

if(val!="" && row.every(index=>squares[index].innerHTML==val)){

score+=60;
found=true;

row.forEach(index=>squares[index].innerHTML="");

}

}

let col=[i,i+width,i+width*2];

if(i<width*(height-2)){

let val=squares[i].innerHTML;

if(val!="" && col.every(index=>squares[index].innerHTML==val)){

score+=60;
found=true;

col.forEach(index=>squares[index].innerHTML="");

}

}

}

if(found){

updateUI();
levelSystem();

}

}

function dropCandies(){

for(let i=width*height-1;i>=0;i--){

if(squares[i].innerHTML==""){

if(i-width>=0){

squares[i].innerHTML=squares[i-width].innerHTML;
squares[i-width].innerHTML="";

}else{

squares[i].innerHTML=randomCandy();

}

}

}

}

setInterval(()=>{

checkMatches();
dropCandies();

},400);

createBoard();

</script>

</body>
</html>
