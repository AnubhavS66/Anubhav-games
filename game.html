<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Candy Blast</title>

<style>
body{
background:#1a1a2e;
color:white;
font-family:Arial;
text-align:center;
}

h1{
color:#ffcc00;
}

#board{
display:grid;
grid-template-columns: repeat(8,50px);
grid-gap:5px;
justify-content:center;
margin-top:20px;
}

.candy{
width:50px;
height:50px;
border-radius:10px;
cursor:pointer;
}

.red{background:red;}
.blue{background:blue;}
.green{background:green;}
.yellow{background:yellow;}
.purple{background:purple;}

.bomb{
background:black;
color:white;
font-weight:bold;
display:flex;
justify-content:center;
align-items:center;
}

#withdrawBox{
margin-top:20px;
}
</style>
</head>

<body>

<h1>Candy Blast</h1>

Score: <span id="score">0</span>
&nbsp;&nbsp;
Level: <span id="level">1</span>
&nbsp;&nbsp;
Coins: <span id="coins">0</span>

<div id="board"></div>

<div id="withdrawBox">
<input id="upi" placeholder="Enter UPI ID">
<button onclick="withdraw()">Withdraw</button>
<p id="money"></p>
</div>

<script>

const width = 8
const colors = ["red","blue","green","yellow","purple"]

let board = []
let score = 0
let level = 1
let coins = 0

let first = null
let second = null

const boardDiv = document.getElementById("board")

// LOAD SAVE
if(localStorage.save){
let save = JSON.parse(localStorage.save)
score = save.score
level = save.level
coins = save.coins
}

updateUI()

// CREATE BOARD
function createBoard(){

boardDiv.innerHTML = ""

for(let i=0;i<width*width;i++){

let candy

if(Math.random()<0.05){
candy = "bomb"
}else{
candy = colors[Math.floor(Math.random()*colors.length)]
}

board[i] = candy

let div = document.createElement("div")
div.className = "candy "+candy

if(candy=="bomb") div.innerHTML="💣"

div.dataset.id = i

div.onclick = selectCandy

boardDiv.appendChild(div)

}

}

createBoard()

// SELECT
function selectCandy(){

let id = parseInt(this.dataset.id)

if(first==null){
first=id
this.style.border="3px solid white"
}
else{

second=id

swap(first,second)

first=null
second=null

updateBoard()

}

}

// SWAP
function swap(a,b){

let temp = board[a]
board[a]=board[b]
board[b]=temp

}

// UPDATE BOARD
function updateBoard(){

checkMatches()
dropCandies()
drawBoard()
updateUI()
save()

}

// DRAW
function drawBoard(){

boardDiv.innerHTML=""

for(let i=0;i<board.length;i++){

let candy = board[i]

let div=document.createElement("div")

div.className="candy "+candy

if(candy=="bomb") div.innerHTML="💣"

div.dataset.id=i

div.onclick=selectCandy

boardDiv.appendChild(div)

}

}

// MATCH CHECK
function checkMatches(){

for(let i=0;i<board.length;i++){

// horizontal
if(i%width<width-2){

let a=i
let b=i+1
let c=i+2

if(board[a]==board[b] && board[b]==board[c] && board[a]!=""){

destroy(a)
destroy(b)
destroy(c)

}
}

// vertical
if(i<width*(width-2)){

let a=i
let b=i+width
let c=i+width*2

if(board[a]==board[b] && board[b]==board[c] && board[a]!=""){

destroy(a)
destroy(b)
destroy(c)

}

}

}

}

// DESTROY
function destroy(i){

if(board[i]=="") return

if(board[i]=="bomb"){

let row=Math.floor(i/width)
let col=i%width

for(let r=row-1;r<=row+1;r++){
for(let c=col-1;c<=col+1;c++){

let id=r*width+c

if(id>=0 && id<64) board[id]=""

}
}

score+=50
coins+=10

}
else{

board[i]=""

score+=10
coins+=2

}

// LEVEL SYSTEM
if(score>=level*200){
level++

if(level%10==0){
coins+=500
alert("Level 10 complete! 500 coins reward!")
}

}

}

// DROP
function dropCandies(){

for(let i=board.length-1;i>=0;i--){

if(board[i]==""){

let above=i-width

if(above>=0){

board[i]=board[above]
board[above]=""

}
else{

board[i]=colors[Math.floor(Math.random()*colors.length)]

}

}

}

}

// UI
function updateUI(){

document.getElementById("score").innerText=score
document.getElementById("level").innerText=level
document.getElementById("coins").innerText=coins

}

// SAVE
function save(){

localStorage.save=JSON.stringify({
score,level,coins
})

}

// WITHDRAW
function withdraw(){

let upi=document.getElementById("upi").value

if(coins>=10000){

let money=coins/1000

document.getElementById("money").innerText=
"Withdraw success ₹"+money+" to "+upi

coins=0
save()
updateUI()

}
else{

alert("Need 10000 coins")

}

}

</script>

</body>
</html>
