<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Blast Pro Max</title>

<style>

body{
background: radial-gradient(circle, #1a0033, #000);
margin:0;
font-family:sans-serif;
color:white;
overflow:hidden;
}

.header{
display:flex;
justify-content:space-around;
align-items:center;
height:60px;
background:rgba(255,255,255,0.05);
border-bottom:2px solid cyan;
font-weight:bold;
}

.header div{
font-size:20px;
color:cyan;
text-shadow:0 0 10px cyan;
}

.grid{
display:grid;
grid-template-columns:repeat(7,1fr);
grid-template-rows:repeat(9,1fr);
gap:4px;
padding:10px;
height:calc(100vh - 60px);
}

.candy{
display:flex;
justify-content:center;
align-items:center;
font-size:32px;
background:rgba(255,255,255,0.05);
border-radius:10px;
}

#msg{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
color:yellow;
display:none;
}

</style>
</head>
<body>

<div class="header">

<div id="score">Score: 0</div>

<div id="level">Level: 1</div>

<div id="coins">Coins: 0</div>

</div>

<div id="msg"></div>

<div class="grid" id="grid"></div>

<script>

const grid=document.getElementById("grid");

const scoreDisplay=document.getElementById("score");
const levelDisplay=document.getElementById("level");
const coinsDisplay=document.getElementById("coins");
const msg=document.getElementById("msg");

const width=7;
const height=9;

const items=["🍭","💎","🚀","🔥","🍓"];

let squares=[];

let score=parseInt(localStorage.getItem("score"))||0;
let level=parseInt(localStorage.getItem("level"))||1;
let coins=parseInt(localStorage.getItem("coins"))||0;

updateUI();

function saveGame(){

localStorage.setItem("score",score);
localStorage.setItem("level",level);
localStorage.setItem("coins",coins);

}

function updateUI(){

scoreDisplay.innerText="Score: "+score;

levelDisplay.innerText="Level: "+level;

coinsDisplay.innerText="Coins: "+coins;

saveGame();

}

function showMsg(text){

msg.innerText=text;
msg.style.display="block";

setTimeout(()=>{
msg.style.display="none";
},1000);

}

function levelSystem(){

let newLevel=Math.floor(score/500)+1;

if(newLevel>level){

level=newLevel;

showMsg("LEVEL UP!");

if(level%10===0){

coins+=500;

showMsg("+500 COINS BONUS!");

}

updateUI();

}

}

function createBoard(){

for(let i=0;i<width*height;i++){

const div=document.createElement("div");

div.className="candy";

div.id=i;

div.innerHTML=items[Math.floor(Math.random()*items.length)];

grid.appendChild(div);

squares.push(div);

div.addEventListener("click",()=>swapCandy(i));

}

}

let first=null;

function swapCandy(id){

if(first===null){

first=id;

return;

}

let second=id;

let temp=squares[first].innerHTML;

squares[first].innerHTML=squares[second].innerHTML;

squares[second].innerHTML=temp;

checkMatches();

first=null;

}

function checkMatches(){

let found=false;

for(let i=0;i<width*height;i++){

let row=[i,i+1,i+2];

if(i%width<width-2){

let val=squares[i].innerHTML;

if(row.every(index=>squares[index].innerHTML===val)){

score+=60;

found=true;

row.forEach(index=>{

squares[index].innerHTML=items[Math.floor(Math.random()*items.length)];

});

}

}

let col=[i,i+width,i+width*2];

if(i<width*(height-2)){

let val=squares[i].innerHTML;

if(col.every(index=>squares[index].innerHTML===val)){

score+=60;

found=true;

col.forEach(index=>{

squares[index].innerHTML=items[Math.floor(Math.random()*items.length)];

});

}

}

}

if(found){

updateUI();

levelSystem();

}

}

createBoard();

</script>

</body>
</html>
