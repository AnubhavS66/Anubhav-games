<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Candy Blast Pro</title>
<style>
    body { background:#1a1a2e; color:white; font-family:Arial; text-align:center; }
    h1 { color:#ffcc00; }
    #board {
        display:grid;
        grid-template-columns: repeat(8,50px);
        grid-gap:5px;
        justify-content:center;
        margin-top:20px;
    }
    .candy {
        width:50px; height:50px; border-radius:10px; cursor:pointer;
        display:flex; justify-content:center; align-items:center; font-size: 20px;
    }
    .red { background: #ff4d4d; }
    .blue { background: #4d94ff; }
    .green { background: #5cd65c; }
    .yellow { background: #ffff66; color: black; }
    .purple { background: #b366ff; }
    .bomb { background: black; color: white; border: 1px solid white; }
    .selected { border: 3px solid white; box-sizing: border-box; }
    #withdrawBox { margin-top:20px; background: #16213e; padding: 20px; display: inline-block; border-radius: 10px; }
    input { padding: 8px; border-radius: 5px; border: none; }
    button { padding: 8px 15px; background: #ffcc00; border: none; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<h1>Candy Blast</h1>
<p>Score: <span id="score">0</span> | Level: <span id="level">1</span> | Coins: <span id="coins">0</span></p>

<div id="board"></div>

<div id="withdrawBox">
    <input id="upi" placeholder="Enter UPI ID">
    <button onclick="withdraw()">Withdraw</button>
    <p id="money" style="color: #00ff00;"></p>
</div>

<script>
const width = 8;
const colors = ["red","blue","green","yellow","purple"];
let board = [];
let score = 0, level = 1, coins = 0;
let first = null;

const boardDiv = document.getElementById("board");

// LOAD SAVE
if(localStorage.save){
    let save = JSON.parse(localStorage.save);
    score = save.score || 0;
    level = save.level || 1;
    coins = save.coins || 0;
}

function createBoard() {
    board = [];
    for(let i=0; i<width*width; i++) {
        board[i] = Math.random() < 0.05 ? "bomb" : colors[Math.floor(Math.random()*colors.length)];
    }
    drawBoard();
    updateUI();
}

function drawBoard() {
    boardDiv.innerHTML = "";
    board.forEach((candy, i) => {
        let div = document.createElement("div");
        div.className = `candy ${candy}`;
        if(candy === "bomb") div.innerHTML = "💣";
        div.dataset.id = i;
        div.onclick = selectCandy;
        boardDiv.appendChild(div);
    });
}

function selectCandy() {
    let id = parseInt(this.dataset.id);
    if(first === null) {
        first = id;
        drawBoard();
        boardDiv.children[first].classList.add("selected");
    } else {
        let second = id;
        // Check if adjacent (optional but good for gameplay)
        swap(first, second);
        first = null;
        processBoard();
    }
}

function swap(a, b) {
    let temp = board[a];
    board[a] = board[b];
    board[b] = temp;
}

function processBoard() {
    let hasMatches = checkMatches();
    if(hasMatches) {
        setTimeout(() => {
            dropCandies();
            drawBoard();
            processBoard(); // Recursive call for chain reactions
        }, 300);
    }
    updateUI();
    save();
}

function checkMatches() {
    let matched = false;
    let toDestroy = new Set();

    // Horizontal
    for(let i=0; i<64; i++) {
        if(i % width < width - 2) {
            if(board[i] && board[i] === board[i+1] && board[i] === board[i+2] && board[i] !== "bomb") {
                toDestroy.add(i); toDestroy.add(i+1); toDestroy.add(i+2);
                matched = true;
            }
        }
        // Vertical
        if(i < 48) {
            if(board[i] && board[i] === board[i+width] && board[i] === board[i+width*2] && board[i] !== "bomb") {
                toDestroy.add(i); toDestroy.add(i+width); toDestroy.add(i+width*2);
                matched = true;
            }
        }
    }

    toDestroy.forEach(id => destroy(id));
    return matched;
}

function destroy(i) {
    if(!board[i]) return;
    if(board[i] === "bomb") {
        let row = Math.floor(i/width), col = i%width;
        board[i] = ""; 
        for(let r=row-1; r<=row+1; r++) {
            for(let c=col-1; c<=col+1; c++) {
                let id = r*width + c;
                if(id >= 0 && id < 64 && c >= 0 && c < width) board[id] = "";
            }
        }
        score += 50; coins += 10;
    } else {
        board[i] = "";
        score += 10; coins += 2;
    }
    
    if(score >= level * 200) {
        level++;
        if(level % 10 === 0) { coins += 500; alert("Level " + level + " bonus: 500 Coins!"); }
    }
}

function dropCandies() {
    for(let i=0; i<width; i++) {
        for(let j=63; j>=0; j--) {
            if(board[j] === "") {
                for(let k=j-width; k>=-width; k-=width) {
                    if(k >= 0 && board[k] !== "") {
                        board[j] = board[k];
                        board[k] = "";
                        break;
                    } else if (k < 0) {
                        board[j] = colors[Math.floor(Math.random()*colors.length)];
                    }
                }
            }
        }
    }
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("level").innerText = level;
    document.getElementById("coins").innerText = coins;
}

function save() {
    localStorage.save = JSON.stringify({score, level, coins});
}

function withdraw() {
    let upi = document.getElementById("upi").value;
    if(!upi) return alert("Enter UPI ID");
    if(coins >= 10000) {
        document.getElementById("money").innerText = `Withdraw success ₹${coins/1000} to ${upi}`;
        coins = 0; save(); updateUI();
    } else {
        alert("Minimum 10,000 coins required!");
    }
}

createBoard();
</script>
</body>
</html>
