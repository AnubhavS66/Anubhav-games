<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Candy Blast Pro</title>
    <style>
        body { 
            background: radial-gradient(circle, #2c003e, #000); 
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; margin: 0; overflow-x: hidden;
        }
        h1 { color: #ffcc00; margin: 10px; text-shadow: 2px 2px 5px #000; font-size: 40px; }
        
        .stats-container {
            display: flex; justify-content: center; gap: 20px;
            background: rgba(255, 255, 255, 0.1); padding: 15px;
            margin: 10px auto; width: 80%; border-radius: 15px; font-size: 1.2rem;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-gap: 8px;
            justify-content: center;
            margin: 20px auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            border: 5px solid #ffcc00;
            width: fit-content;
        }

        .candy {
            width: 60px; height: 60px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 35px; cursor: pointer; user-select: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.05);
        }

        .candy:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.1); }
        .selected { border: 4px solid #fff; box-shadow: 0 0 20px #fff; transform: scale(1.1); z-index: 10; }

        #withdrawBox {
            background: #16213e; padding: 25px; border-radius: 20px;
            margin: 20px auto; width: 350px; border: 2px solid #ffcc00;
        }

        input { 
            padding: 12px; border-radius: 8px; border: none; width: 80%; 
            margin-bottom: 15px; font-size: 16px;
        }

        button {
            padding: 12px 25px; background: #ffcc00; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;
            transition: 0.3s;
        }

        button:hover { background: #fff; transform: translateY(-2px); }
        #msg { margin-top: 10px; font-weight: bold; color: #00ff00; }
    </style>
</head>
<body>

<h1>CANDY BLAST</h1>

<div class="stats-container">
    <div>🏆 Score: <span id="score">0</span></div>
    <div>⭐ Level: <span id="level">1</span></div>
    <div>💰 Coins: <span id="coins">0</span></div>
</div>

<div id="board"></div>

<div id="withdrawBox">
    <h3>💰 My Wallet</h3>
    <input id="upi" placeholder="Enter UPI ID (e.g. name@upi)">
    <button onclick="withdraw()">Withdraw Cash</button>
    <p id="msg"></p>
    <small style="opacity: 0.6;">Min. Withdraw: 10,000 Coins</small>
</div>

<script>
const width = 8;
const candyTypes = ['🍎', '🍇', '🍊', '🍓', '💎', '🥝'];
let board = [];
let score = 0, level = 1, coins = 0;
let firstSelectedId = null;

const boardDiv = document.getElementById("board");

function createBoard() {
    board = [];
    for (let i = 0; i < width * width; i++) {
        let randomCandy = candyTypes[Math.floor(Math.random() * candyTypes.length)];
        board.push(randomCandy);
    }
    // Initial cleaning (taki start mein hi matches na ho)
    checkAndProcess();
    render();
}

function render() {
    boardDiv.innerHTML = "";
    board.forEach((candy, i) => {
        const div = document.createElement("div");
        div.className = "candy";
        div.innerHTML = candy;
        div.setAttribute("data-id", i);
        div.onclick = handleSelection;
        boardDiv.appendChild(div);
    });
}

function handleSelection() {
    let id = parseInt(this.getAttribute("data-id"));

    if (firstSelectedId === null) {
        firstSelectedId = id;
        this.classList.add("selected");
    } else {
        let secondSelectedId = id;
        if (isAdjacent(firstSelectedId, secondSelectedId)) {
            swap(firstSelectedId, secondSelectedId);
        }
        firstSelectedId = null;
        render();
    }
}

function isAdjacent(id1, id2) {
    const row1 = Math.floor(id1 / width), col1 = id1 % width;
    const row2 = Math.floor(id2 / width), col2 = id2 % width;
    return (Math.abs(row1 - row2) + Math.abs(col1 - col2)) === 1;
}

function swap(id1, id2) {
    let temp = board[id1];
    board[id1] = board[id2];
    board[id2] = temp;

    if (!checkMatches()) {
        // Match nahi bana toh wapas swap karo
        let back = board[id1];
        board[id1] = board[id2];
        board[id2] = back;
    } else {
        processGame();
    }
}

function checkMatches() {
    for (let i = 0; i < 64; i++) {
        // Horizontal
        if (i % width < width - 2) {
            if (board[i] && board[i] === board[i+1] && board[i] === board[i+2]) return true;
        }
        // Vertical
        if (i < 48) {
            if (board[i] && board[i] === board[i+width] && board[i] === board[i+width*2]) return true;
        }
    }
    return false;
}

function processGame() {
    let toDestroy = new Set();

    // Check Horizontal
    for (let i = 0; i < 64; i++) {
        if (i % width < width - 2) {
            if (board[i] && board[i] === board[i+1] && board[i] === board[i+2]) {
                toDestroy.add(i); toDestroy.add(i+1); toDestroy.add(i+2);
            }
        }
        if (i < 48) {
            if (board[i] && board[i] === board[i+width] && board[i] === board[i+width*2]) {
                toDestroy.add(i); toDestroy.add(i+width); toDestroy.add(i+width*2);
            }
        }
    }

    if (toDestroy.size > 0) {
        toDestroy.forEach(id => {
            board[id] = "";
            score += 10;
            coins += 2;
        });
        
        updateUI();
        
        setTimeout(() => {
            refill();
            render();
            processGame(); // Chain reactions
        }, 300);
    }
}

function refill() {
    for (let i = 0; i < width; i++) {
        for (let j = 63; j >= 0; j--) {
            if (board[j] === "") {
                if (j < width) {
                    board[j] = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                } else {
                    let above = j - width;
                    while (above >= 0 && board[above] === "") above -= width;
                    if (above >= 0) {
                        board[j] = board[above];
                        board[above] = "";
                    } else {
                        board[j] = candyTypes[Math.floor(Math.random() * candyTypes.length)];
                    }
                }
            }
        }
    }
}

function checkAndProcess() {
    // Initial cleanup without scoring
    while(checkMatches()){
        for (let i = 0; i < 64; i++) {
            if (i % width < width - 2 && board[i] === board[i+1] && board[i] === board[i+2]) board[i] = candyTypes[Math.floor(Math.random()*6)];
            if (i < 48 && board[i] === board[i+width] && board[i] === board[i+width*2]) board[i] = candyTypes[Math.floor(Math.random()*6)];
        }
    }
}

function updateUI() {
    document.getElementById("score").innerText = score;
    document.getElementById("coins").innerText = coins;
    level = Math.floor(score / 500) + 1;
    document.getElementById("level").innerText = level;
}

function withdraw() {
    let upi = document.getElementById("upi").value;
    if (upi.length < 5 || !upi.includes("@")) {
        alert("Sahi UPI ID dalo bhai!");
        return;
    }
    if (coins >= 10000) {
        document.getElementById("msg").innerText = "Success! ₹" + (coins/1000) + " sent to " + upi;
        coins = 0;
        updateUI();
    } else {
        alert("Bhai 10,000 coins hone par hi withdraw hoga! Abhi " + (10000 - coins) + " aur chahiye.");
    }
}

createBoard();
</script>
</body>
</html>
