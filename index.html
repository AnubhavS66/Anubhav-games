  <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Login | Emoji Blast</title>
    <style>
        body { 
            margin: 0; background: #0a0a23; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            font-family: 'Poppins', sans-serif; overflow: hidden;
        }
        .container { display: flex; align-items: center; gap: 20px; position: relative; }
        
        /* 3D Character Animation */
        .character {
            width: 200px; height: 350px;
            background: url('https://img.freepik.com') no-repeat center/contain;
            animation: moveCharacter 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px cyan);
        }
        @keyframes moveCharacter {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            50% { transform: translateX(10px) rotate(2deg); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 20px; 
            border: 2px solid #ff007f; box-shadow: 0 0 30px #ff007f; 
            width: 320px; text-align: center; backdrop-filter: blur(15px);
        }
        h2 { color: cyan; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }
        input { 
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; 
            border: 1px solid #444; background: rgba(0,0,0,0.7); color: white; 
            box-sizing: border-box; outline: none; 
        }
        input:focus { border-color: cyan; box-shadow: 0 0 15px cyan; }
        .btn { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            background: linear-gradient(45deg, #ff007f, #8000ff); 
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 25px #ff007f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="character"></div>
        <div class="login-card">
            <h2>GAMER LOGIN</h2>
            <!-- Yahan Formspree link kaam karega -->
            <form action="https://formspree.io" method="POST">
                <input type="text" name="username" placeholder="Gamer Name" required>
                <input type="password" name="password" placeholder="Password" required>
                
                <!-- LOGIN KE BAAD GAME PAR BHEJNE KE LIYE -->
                <input type="hidden" name="_next" value="index.html">
                
                <button type="submit" class="btn">START GAME 🚀</button>
            </form>
        </div>
    </div>
</body>
</html>
